<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player" aria-label="Music player">

    <section class="now">
      <div class="disc" id="disc" aria-hidden="true"><div class="hole"></div></div>
      <h1 id="title">Song title</h1>
      <p id="artist" class="artist">Artist</p>
    </section>

    <section class="progress-area">
      <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
      <input type="range" id="progress" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    </section>

    <section class="controls">
      <button id="shuffle" class="icon-btn small" aria-label="Shuffle" aria-pressed="false" title="Shuffle">&#8644;</button>
      <button id="prev" class="icon-btn" aria-label="Previous song" title="Previous">&#9198;&#xFE0E;</button>
      <button id="play" class="play-btn" aria-label="Play" title="Play / Pause (Space)">&#9654;&#xFE0E;</button>
      <button id="next" class="icon-btn" aria-label="Next song" title="Next">&#9197;&#xFE0E;</button>
      <button id="repeat" class="icon-btn small" aria-label="Repeat playlist" aria-pressed="true" title="Autoplay next song">&#8635;</button>
    </section>

    <section class="volume">
      <button id="mute" class="icon-btn small" aria-label="Mute" title="Mute">&#128266;&#xFE0E;</button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
      <span id="volLabel">70%</span>
    </section>

    <section class="playlist">
      <h2>Playlist</h2>
      <ul id="playlist"></ul>
    </section>

    <p class="hint">Space: play/pause &nbsp;|&nbsp; Up/Down: volume &nbsp;|&nbsp; Shift + Left/Right: previous/next</p>
    <audio id="audio" preload="metadata"></audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
