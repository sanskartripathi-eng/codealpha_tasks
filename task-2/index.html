<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calculator"><h1>Calculator</h1><div id="display" class="display" aria-live="polite">0</div><div class="keys">
<button data-action="clear" class="utility">AC</button><button data-action="sign" class="utility">+/−</button><button data-action="percent" class="utility">%</button><button data-op="/" class="operator">÷</button>
<button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button data-op="*" class="operator">×</button>
<button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button data-op="-" class="operator">−</button>
<button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button data-op="+" class="operator">+</button>
<button data-num="0" class="zero">0</button><button data-action="decimal">.</button><button data-action="equals" class="equals">=</button>
</div></main>
<script src="script.js"></script>
</body>
</html>
